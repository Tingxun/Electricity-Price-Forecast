# 特征配置文件 V2
# 针对T+1预测场景的特征配置
# 特征命名格式：
#   - 时间特征: 月份, 星期, 是否周末, 季度
#   - 日前特征: 日前_H{hour}_{变量名}
#   - 滞后特征: 滞后{lag}天_H{hour}_{变量名}
#   - 滚动特征: 滚动{window}天均值/标准差_H{hour}_{变量名}

