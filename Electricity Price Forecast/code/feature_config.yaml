# 模型特定特征配置
model_features:
  # 线性模型 - 适合标准化后的特征，对多重共线性敏感
  LinearRegression:
    feature_groups:
      - time_basic
      - dayahead_load
      - lag_price_1d
    description: "基础特征，避免过多共线性"
    normalize: true
    
  Ridge:
    feature_groups:
      - time_extended
      - dayahead_load
      - dayahead_renewable
      - dayahead_hydro
      - dayahead_other
      - lag_price_1d
      - lag_price_2d
      - lag_price_3d
    description: "完整特征，L2正则化处理共线性"
    normalize: true
    
  Lasso:
    feature_groups:
      - time_extended
      - dayahead_load
      - dayahead_renewable
      - dayahead_hydro
      - dayahead_other
      - lag_price_1d
      - lag_price_2d
      - lag_price_3d
    description: "完整特征，L1正则化自动特征选择"
    normalize: true
    
  ElasticNet:
    feature_groups:
      - time_extended
      - dayahead_load
      - dayahead_renewable
      - dayahead_hydro
      - dayahead_other
      - lag_price_1d
      - lag_price_2d
      - lag_price_3d
    description: "完整特征，L1+L2正则化"
    normalize: true
    
  # 树模型 - 对特征缩放不敏感，能处理非线性关系
  RandomForest:
    feature_groups:
      - time_extended
      - dayahead_load
      - dayahead_renewable
      - dayahead_hydro
      - dayahead_other
      - lag_price_1d
      - lag_price_2d
      - lag_price_3d
      - lag_price_7d
    description: "完整特征，集成学习抗过拟合"
    normalize: false
    
  GradientBoosting:
    feature_groups:
      - time_extended
      - dayahead_load
      - dayahead_renewable
      - dayahead_hydro
      - dayahead_other
      - lag_price_1d
      - lag_price_2d
      - lag_price_3d
      - lag_price_7d
    description: "完整特征，梯度提升"
    normalize: false
    
  XGBoost:
    feature_groups:
      - time_extended
      - dayahead_load
      - dayahead_renewable
      - dayahead_hydro
      - dayahead_other
      - lag_price_1d
      - lag_price_2d
      - lag_price_3d
      - lag_price_7d
    description: "完整特征，高效梯度提升"
    normalize: false
