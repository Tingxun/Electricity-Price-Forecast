# 模型特定特征配置
model_features:
  # 线性模型
  LinearRegression:
    feature_groups:
      - time_basic
      - dayahead_load
      - dayahead_price
      - lag_price_1d
    description: "基础特征"
    normalize: true

  Ridge:
    feature_groups:
      - time_basic
      - dayahead_load
      - dayahead_nonmarket
      - dayahead_renewable
      - dayahead_price
      - lag_price_1d
      - lag_price_2d
      - lag_price_7d
    description: "完整特征，L2正则化"
    normalize: true

  Lasso:
    feature_groups:
      - time_basic
      - dayahead_load
      - dayahead_price
      - lag_price_1d
      - lag_price_7d
    description: "L1正则化自动特征选择"
    normalize: true

  ElasticNet:
    feature_groups:
      - time_basic
      - dayahead_load
      - dayahead_nonmarket
      - dayahead_renewable
      - dayahead_price
      - lag_price_1d
      - lag_price_2d
      - lag_price_3d
    description: "L1+L2正则化"
    normalize: true

  # 树模型
  RandomForest:
    feature_groups:
      - time_basic
      - dayahead_load
      - dayahead_nonmarket
      - dayahead_renewable
      - dayahead_price
      - lag_price_1d
      - lag_price_7d
    description: "完整特征，集成学习"
    normalize: false

  GradientBoosting:
    feature_groups:
      - time_basic
      - dayahead_load
      - dayahead_nonmarket
      - dayahead_renewable
      - dayahead_price
      - lag_price_1d
      - lag_price_2d
      - lag_price_3d
    description: "完整特征，梯度提升"
    normalize: false

  XGBoost:
    feature_groups:
      - time_basic
      - dayahead_load
      - dayahead_nonmarket
      - dayahead_renewable
      - dayahead_price
      - lag_price_1d
      - lag_price_2d
      - lag_price_3d
      - lag_price_7d
    description: "完整特征，XGBoost"
    normalize: false
