# 特征配置文件 - 更新版
# 适配包含气象和市场信息的完整数据集
# 
# 重要说明：
# - 市场数据中的"实时"列已用"日前"数据填充（除价格外）
# - 因此市场特征本质上是T+1日的日前披露数据
# - 气象特征是T+1日的24小时气象预报
# - 目标：T+1日的24点实时价格

