# 模型特定特征配置
model_features:
  # 线性模型 - 不使用气象特征（避免维度灾难）
  LinearRegression:
    feature_groups:
      - time_basic
      - dayahead_load
      - lag_price_1d
    description: "基础特征（时间+日前负荷+滞后1天价格）"
    normalize: true

  Ridge:
    feature_groups:
      - time_basic
      - dayahead_load
      - dayahead_nonmarket
      - dayahead_wind
      - dayahead_solar
      - lag_price_1d
      - lag_price_2d
      - lag_price_7d
    description: "完整日前市场特征+L2正则化（无气象特征）"
    normalize: true

  Lasso:
    feature_groups:
      - time_basic
      - dayahead_load
      - lag_price_1d
      - lag_price_7d
    description: "L1正则化自动特征选择（无气象特征）"
    normalize: true

  # 树模型 - 包含气象特征（通过模式匹配）
  RandomForest:
    feature_groups:
      - time_basic
      - dayahead_load
      - dayahead_nonmarket
      - dayahead_wind
      - dayahead_solar
      - dayahead_hydro
      - dayahead_tie_line
      - lag_price_1d
      - lag_price_7d
    include_patterns:
      - "气象_H"  # 匹配所有气象特征（T+1日的24小时气象预报）
    description: "完整日前市场特征+T+1日气象预报，集成学习"
    normalize: false

  XGBoost:
    feature_groups:
      - time_basic
      - dayahead_load
      - dayahead_nonmarket
      - dayahead_wind
      - dayahead_solar
      - dayahead_hydro
      - dayahead_tie_line
      - lag_price_1d
      - lag_price_2d
      - lag_price_3d
      - lag_price_7d
    include_patterns:
      - "气象_H"  # 匹配所有气象特征（T+1日的24小时气象预报）
    description: "完整日前市场特征+T+1日气象预报，XGBoost"
    normalize: false

  LightGBM:
    feature_groups:
      - time_basic
      - dayahead_load
      - dayahead_nonmarket
      - dayahead_wind
      - dayahead_solar
      - dayahead_hydro
      - dayahead_tie_line
      - lag_price_1d
      - lag_price_2d
      - lag_price_3d
      - lag_price_7d
    include_patterns:
      - "气象_H"  # 匹配所有气象特征（T+1日的24小时气象预报）
    description: "完整日前市场特征+T+1日气象预报，LightGBM"
    normalize: false
