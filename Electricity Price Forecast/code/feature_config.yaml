# Direct multi-step feature configuration
#
# 每个预测小时使用独立模型。这里集中控制各模型可见的输入特征。
# feature_groups 支持:
#   features: 精确列名
#   patterns: 正则表达式，匹配由特征工程生成的动态列名

feature_groups:
  direct_time:
    features:
      - 月份
      - 星期
      - 是否周末
      - 季度

  direct_price_lag:
    patterns:
      - "^滞后\\d+天_H\\d{2}_价格$"
      - "^滞后2天_H\\d{2}_(前1h|后1h)_价格$"
      - "^历史价格_"

  direct_market_window:
    patterns:
      - "^(当前|滞后1h|未来1h)_市场_"
      - "^市场变化_"
      - "^市场日形态_"

  direct_weather_window:
    patterns:
      - "^(当前|滞后1h|未来1h)_气象_"

default:
  description: Direct 默认特征集
  feature_groups:
    - direct_time
    - direct_price_lag
    - direct_market_window
    - direct_weather_window
  normalize: false

model_features:
  lightgbm:
    description: LightGBM Direct 每小时独立模型
    feature_groups:
      - direct_time
      - direct_price_lag
      - direct_market_window
    normalize: false

  lightgbm_smape_probe:
    description: LightGBM Direct sMAPE探针参数组
    feature_groups:
      - direct_time
      - direct_price_lag
      - direct_market_window
    normalize: false

  xgboost:
    description: XGBoost Direct 每小时独立模型
    feature_groups:
      - direct_time
      - direct_price_lag
      - direct_market_window
      - direct_weather_window
    normalize: false

  random_forest:
    description: RandomForest Direct 每小时独立模型
    feature_groups:
      - direct_time
      - direct_price_lag
      - direct_market_window
      - direct_weather_window
    normalize: false

  ridge:
    description: Ridge Direct 线性基线
    feature_groups:
      - direct_time
      - direct_price_lag
      - direct_market_window
      - direct_weather_window
    normalize: true

  lasso:
    description: Lasso Direct 线性基线
    feature_groups:
      - direct_time
      - direct_price_lag
      - direct_market_window
      - direct_weather_window
    normalize: true
