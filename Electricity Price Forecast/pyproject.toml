[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "electricity-price-forecast"
version = "0.1.0"
description = "Multi-source heterogeneous data electricity price forecasting workflows."
requires-python = ">=3.10"
dependencies = [
    "joblib",
    "lightgbm",
    "matplotlib",
    "numpy",
    "pandas",
    "scikit-learn",
    "seaborn",
    "torch",
    "xgboost",
]

[project.scripts]
epf = "EPF.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
